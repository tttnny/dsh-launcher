name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Quality (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install native prerequisites
        shell: bash
        run: ./ci/install-macos.sh
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-quality
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # One step, because the gate list lives in ci/verify.sh: fmt, clippy, the
      # Rust tests, the manifest sync check, every ci/*.test.mjs (found by glob,
      # so a new suite is picked up without editing anything here) and the
      # frontend build. A developer runs the same line locally.
      - name: Verify
        run: pnpm verify

  integration:
    name: Integration checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No pnpm in this job; disable package-manager cache so setup-node
          # does not try to locate a pnpm executable.
          package-manager-cache: false
      # This project has no container-backed protocol tests; the isolated
      # Linux job runs the checks that need no dependencies — the manifest
      # synchronization check and the source-level contract tests. Which
      # checks those are lives in ci/verify.sh too, so this job does not keep
      # a second copy of the list (and a new ci/*.test.mjs is picked up there
      # by glob).
      - name: Verify (checks that need no dependencies)
        run: ./ci/verify.sh --source-only
