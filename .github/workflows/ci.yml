name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Quality (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install native prerequisites
        shell: bash
        run: ./ci/install-macos.sh
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-quality
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # Advisory only: these sources are hand-formatted (long lines, and
      # signatures wrapped by hand that rustfmt would re-join), so `--check`
      # reports diffs across most files. Gating on it would block every
      # release until a repo-wide reformat lands, and that reformat would
      # collide with the parallel worktrees this repo is developed in.
      - name: Format check (advisory)
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --locked
      - name: Frontend build
        run: pnpm build

  integration:
    name: Integration checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No pnpm in this job; disable package-manager cache so setup-node
          # does not try to locate a pnpm executable.
          package-manager-cache: false
      # This project has no container-backed protocol tests; the isolated
      # Linux job runs the source-level contract tests and the manifest
      # synchronization check instead. All of them only read files, so they
      # run on any platform.
      - name: Version synchronization
        run: node ci/check-versions.mjs
      - name: Release-note classifier tests
        run: node --test ci/release-notes.test.mjs
      - name: Bump-version tests
        run: node --test ci/bump-version.test.mjs
      - name: API contract tests
        run: node --test ci/api-contract.test.mjs
      - name: Setup-page guidance tests
        run: node --test ci/setup-guidance.test.mjs

  prepare:
    needs: [quality, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      changelog_version: ${{ steps.release.outputs.changelog_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve idempotent release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./ci/resolve-release.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"

  build:
    name: Package (macos-aarch64)
    needs: prepare
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install platform prerequisites
        shell: bash
        run: ./ci/install-macos.sh
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-aarch64-release
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Stamp build version
        # Writes the resolved version (v<ver>-dev.<run> for branch builds,
        # the tag version for releases) into package.json / tauri.conf.json /
        # Cargo.toml / Cargo.lock so the packaged app reports it.
        run: node ci/set-version.mjs "${{ needs.prepare.outputs.version }}"
      - name: Package and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          args: --target aarch64-apple-darwin --bundles dmg

  update-release-notes:
    name: Update release notes
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history is required to collect commits since the previous tag.
          fetch-depth: 0
      - name: Render downloads table and commit list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # Release notes in this repo are curated by hand (bilingual: Chinese
          # section, then English). Auto-fill the body only while it still
          # holds the placeholder resolve-release.sh wrote, so re-running a
          # finished release never replaces hand-written notes with the raw
          # download table and commit list.
          CURRENT_BODY="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" \
            --jq .body)"
          if [[ "$CURRENT_BODY" != "Preparing artifacts"* ]]; then
            echo "release body was already written; keeping existing notes"
            exit 0
          fi
          ./ci/update-release-notes.sh \
            "${{ needs.prepare.outputs.release_id }}" \
            "${{ needs.prepare.outputs.tag }}" \
            "${{ needs.prepare.outputs.prerelease }}"

  # After a STABLE release (v0.2.4 etc.), bump the manifest version to the
  # next patch (0.2.5) so the next release tag is one patch ahead. Dev builds
  # (v0.2.4-dev.N) and pre-releases never trigger this job.
  bump-version:
    name: Bump version to next patch
    needs: [prepare, build]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.prepare.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit must land on the branch the tag points at (main).
          ref: main
          fetch-depth: 0
      - name: Bump manifest version
        id: bump
        run: |
          node ci/bump-version.mjs "${{ needs.prepare.outputs.tag }}"
      - name: Commit and push version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "no version change to commit (already bumped)"
            exit 0
          fi
          git commit -m "chore(release): bump version to next patch"
          git push origin main
